name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Khắc phục Lỗi 1: Cấp quyền thực thi cho Gradle Wrapper trước khi chạy test
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Khắc phục Lỗi 2: Sử dụng đúng tên biến Secret đăng nhập (secrets.REGISTRY_TOKEN)
    - name: Log in to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    # Khắc phục Lỗi 3: Chỉ định đúng context và đường dẫn file Dockerfile
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.REGISTRY_USERNAME }}/spring-app:latest